version: '3.9'

services:
  # Backend API
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: leadflow-server
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_URI: ${MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
    networks:
      - leadflow-net
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/health']
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend UI
  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://server:3000/api/v1
    container_name: leadflow-ui
    restart: unless-stopped
    ports:
      - '3001:3001'
    depends_on:
      server:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: http://server:3000/api/v1
    networks:
      - leadflow-net

networks:
  leadflow-net:
    driver: bridge
